name: NHC Tropical API

on:
  schedule:
    # Every 1.5 hours  — GitHub Actions only supports full-minute cron expressions,
    # so we fire at :00 and :30 of alternating hours to approximate 90-minute intervals.
    # Sequence: 00:00 → 01:30 → 03:00 → 04:30 … (repeating every 3 hours, two runs)
    - cron: "0 0,3,6,9,12,15,18,21 * * *"   # top of every 3rd hour
    - cron: "30 1,4,7,10,13,16,19,22 * * *"  # 1.5 hours after each
  workflow_dispatch:  # allow manual triggering

permissions:
  contents: write   # allow the workflow to commit & push

jobs:
  build:
    name: Fetch & Build NHC GeoJSON
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # ── 4. Run the builder ────────────────────────────────────────────────────
      - name: Build NHC GeoJSON files
        env:
          XWEATHER_CLIENT_ID:     ${{ secrets.XWEATHER_CLIENT_ID }}
          XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
        run: python scripts/build_nhc_geojson.py

      # ── 5. Verify output ─────────────────────────────────────────────────────
      - name: Verify output files exist
        run: |
          for f in \
            docs/tropical_api/atlantic_nhc.geojson \
            docs/tropical_api/epac_nhc.geojson \
            docs/tropical_api/cpac_nhc.geojson; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
            echo "OK: $f  ($(wc -c < "$f") bytes)"
          done

      # ── 6. Validate JSON ─────────────────────────────────────────────────────
      - name: Validate GeoJSON (basic JSON syntax)
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          files = [
              "docs/tropical_api/atlantic_nhc.geojson",
              "docs/tropical_api/epac_nhc.geojson",
              "docs/tropical_api/cpac_nhc.geojson",
          ]
          errors = []
          for fp in files:
              try:
                  data = json.loads(pathlib.Path(fp).read_text())
                  assert data.get("type") == "FeatureCollection", "not a FeatureCollection"
                  n = len(data.get("features", []))
                  print(f"  {fp}: {n} features — OK")
              except Exception as e:
                  errors.append(f"  FAIL {fp}: {e}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          EOF

      # ── 7. Commit & push ─────────────────────────────────────────────────────
      - name: Commit updated GeoJSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            docs/tropical_api/atlantic_nhc.geojson \
            docs/tropical_api/epac_nhc.geojson \
            docs/tropical_api/cpac_nhc.geojson

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "chore(tropical-api): update NHC GeoJSON [${TIMESTAMP}]

          Auto-generated by the NHC Tropical API workflow.
          Sources: NHC GIS RSS feeds + GTWO KMZ + xWeather Tropical Cyclones API"
            git push
          fi

      # ── 8. Summary ────────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib, datetime

          md = ["## NHC Tropical API — Build Summary", ""]
          md.append(f"**Run time:** {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}")
          md.append("")
          md.append("| Basin | File | Features | Active Storms | GTWO Areas |")
          md.append("|-------|------|----------|---------------|------------|")

          files = {
              "Atlantic": "docs/tropical_api/atlantic_nhc.geojson",
              "EPAC":     "docs/tropical_api/epac_nhc.geojson",
              "CPAC":     "docs/tropical_api/cpac_nhc.geojson",
          }

          for basin, fp in files.items():
              try:
                  data = json.loads(pathlib.Path(fp).read_text())
                  feats = data.get("features", [])
                  meta = next(
                      (f["properties"] for f in feats
                       if f.get("properties", {}).get("nhc_product") == "metadata"),
                      {}
                  )
                  n_feats   = len(feats)
                  n_storms  = meta.get("active_storms", "?")
                  n_gtwo    = meta.get("gtwo_areas", "?")
                  md.append(f"| {basin} | `{fp}` | {n_feats} | {n_storms} | {n_gtwo} |")
              except Exception as e:
                  md.append(f"| {basin} | `{fp}` | ❌ {e} | — | — |")

          summary_path = pathlib.Path(
              __import__("os").environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          )
          summary_path.write_text("\n".join(md) + "\n")
          EOF
